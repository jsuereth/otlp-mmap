name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Run cargo test
        working-directory: ./rust
        # TODO: Remove --cap-lints=warn after enforcing stronger clippy compliance
        # Currently needed because --all-features enables code with unused variables
        # Note: Excluding otlp-mmap-pybindings because pyo3 with extension-module feature
        # cannot link in test binaries. The Python bindings are tested separately.
        # Using --lib --bins to skip doctests which have known issues.
        run: RUSTFLAGS="--cap-lints=warn" cargo test --workspace --exclude otlp-mmap-pybindings --all-features --lib --bins
